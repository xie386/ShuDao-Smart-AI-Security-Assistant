# 蜀道智能安全助手 — Nginx 配置（D5 P4：静态托管前端 + 反向代理）
#
# 职责：
#   /            → 前端静态托管（front/ 目录）
#   /api/*       → 反向代理 backend:8000（REST + SSE 流式聊天）
#   /uploads/*   → 后端静态资源（隐患图 / 整改照）
#   /ppt-files/* → 后端静态资源（生成的 pptx 下载）
#   /health      → 后端健康探针
#   /docs        → Swagger
#
# 注意：
#   - SSE 流式聊天（/api/chat/stream）必须 proxy_buffering off，否则前端收不到逐字流
#   - 前端页面内全部用相对路径 /api/... 请求，反代后无需改前端代码
server {
    listen 80;
    server_name _;

    client_max_body_size 20m;   # 隐患图上传 ≤10MB（后端限制），留余量

    # ---- 前端静态托管 ----
    root /usr/share/nginx/html/front;
    index index.html;

    # 根路径 → safety 完整版
    location = / {
        return 302 /safety/;
    }

    # ---- 后端 API（REST + SSE） ----
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式：关缓冲 + 长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- 后端静态资源（图片 / pptx） ----
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /ppt-files/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # ---- 后端探针与文档 ----
    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /docs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # ---- 静态资源缓存（前端自带 hash 文件名的走强缓存） ----
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
