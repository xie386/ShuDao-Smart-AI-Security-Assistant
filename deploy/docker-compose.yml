# 蜀道智能安全助手 — Docker 一键部署（D5 P4 线：D1/D2）
#
# 服务组成（依据代码事实，非技术书原样）：
#   mysql    : 业务库（shudao_safety），启动时自动执行 database/schema.sql 建表
#   redis    : 会话缓存 / 限流 / 站内消息队列（H08）
#   backend  : FastAPI 应用（含 Chroma 本地持久化目录 /app/backend/chroma，非独立 chroma 容器）
#   nginx    : 静态托管 front/（/safety /demo）+ 反向代理 /api /uploads /ppt-files → backend
#
# 说明：代码中 chromadb 为 PersistentClient 直连本地目录，无独立 Chroma 服务，
#       故复用本机 backend/chroma（已入库 2256 块）做 bind mount，与文档五服务略有出入。
#
# 使用（在 deploy/ 目录下）：
#   docker compose up -d --build
#   # 验证：http://localhost:8080/safety（前端） http://localhost:8080/health（后端探针）
# 停止：docker compose down（加 -v 会连数据卷一起删，谨慎）

services:
  # ---------- 业务数据库 ----------
  mysql:
    image: mysql:8.0
    container_name: shudao-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "shudao_safety"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      # 建表脚本：容器首次启动自动执行（IF NOT EXISTS，幂等）
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # ---------- Redis（requirepass=123456 与 backend/.env 一致） ----------
  redis:
    image: redis:7-alpine
    container_name: shudao-redis
    command: ["redis-server", "--requirepass", "123456"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # ---------- FastAPI 后端 ----------
  backend:
    build:
      context: ..            # 项目根（Dockerfile 内用 backend/ 前缀 COPY）
      dockerfile: deploy/backend/Dockerfile
    container_name: shudao-backend
    env_file:
      # 复用项目 .env（含全部 API Key；Docker 专用覆盖见 environment）
      - ../backend/.env
    environment:
      # 容器内服务发现：mysql/redis 用服务名而非 127.0.0.1
      DATABASE_URL: "mysql+mysqlconnector://root:123456@mysql:3306/shudao_safety?charset=utf8mb4"
      REDIS_URL: "redis://:123456@redis:6379/0"
      # 本地模型挂载到 /models（宿主 D:/LLM/model），覆盖 Windows 硬编码路径
      EMBEDDING_MODEL_PATH: "/models/bge-large-zh"
      RERANKER_MODEL_PATH: "/models/bge-reranker-base"
      # 容器内默认 CPU（避免 GPU 驱动依赖；如需 GPU 直通另配 deploy.resources）
      EMBEDDING_DEVICE: "cpu"
      RERANKER_DEVICE: "cpu"
      # Chroma 持久化目录（bind mount 复用本机已入库数据）
      CHROMA_DIR: "/app/backend/chroma"
      UPLOAD_DIR: "/app/backend/uploads"
    volumes:
      # 复用本机数据：已入库知识库 / 上传图 / PPT 产物（开发机即部署机场景）
      - ../backend/chroma:/app/backend/chroma
      - ../backend/uploads:/app/backend/uploads
      - ../backend/ppt_files:/app/backend/ppt_files
      - D:/LLM/model:/models:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------- Nginx：静态托管前端 + 反向代理 ----------
  nginx:
    image: nginx:1.27-alpine
    container_name: shudao-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../front:/usr/share/nginx/html/front:ro
    ports:
      - "8080:80"   # 宿主 8080 → 容器 80（如需标准 80 端口改 "80:80"）
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
